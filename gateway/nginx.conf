events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Rate Limiting: 30 requests per minute per IP for standard API
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;

    upstream api_gateway {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 20M; # Cho phép upload ảnh camera chất lượng cao

        # Healthcheck endpoint
        location /health {
            return 200 '{"status":"gateway_healthy"}';
            add_header Content-Type application/json;
        }

        # Server-Sent Events (SSE) Stream - Tắt buffering tuyệt đối
        location ~ ^/api/v1/tasks/.+/stream$ {
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Tắt toàn bộ buffer để SSE stream token thời gian thực mượt mà
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 600s;
        }

        # Standard API routes with Rate Limit
        location /api/ {
            limit_req zone=api_limit burst=10 nodelay;

            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }
    }
}
