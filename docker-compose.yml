# NeoBar local stack. Scale workers with: docker compose up -d --scale worker=4
# Benchmark mode (no Nginx throttling): API_RATE=1000000r/m API_BURST=100000 docker compose up -d
# Real ML deps in workers:               WITH_ML=true docker compose up -d --build

services:
  gateway:
    image: nginx:1.27-alpine
    container_name: neobar-gateway
    ports:
      - "80:80"
    environment:
      API_RATE: ${API_RATE:-30r/m}
      API_BURST: ${API_BURST:-10}
    volumes:
      # nginx image runs envsubst on /etc/nginx/templates/*.template -> /etc/nginx/conf.d/
      - ./gateway/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: neobar-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --appendfsync everysec --save 60 1
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: neobar-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # image has no curl/wget; plain TCP check
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: neobar-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: neobar-api
    ports:
      - "8000:8000"   # direct access bypasses Nginx rate limiting (dev only)
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: neobar-api
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: unless-stopped

  # No container_name on purpose: required for --scale. Node id = container hostname.
  worker:
    build:
      context: .
      dockerfile: services/workers/Dockerfile
      args:
        WITH_ML: ${WITH_ML:-false}
    deploy:
      replicas: 2
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: neobar-worker
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: unless-stopped

volumes:
  redis_data:
  qdrant_data: