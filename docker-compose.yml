version: '3.8'

services:
  # ========================================================
  # Layer 7 Gateway / Ingress Reverse Proxy
  # ========================================================
  gateway:
    image: nginx:alpine
    container_name: barvision-gateway
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: always

  # ========================================================
  # Distributed Cache, Lock (Leader Election) & Task Queue
  # ========================================================
  redis:
    image: redis:7-alpine
    container_name: barvision-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --save 60 1
    volumes:
      - redis_data:/data
    restart: always

  # ========================================================
  # Vector Database: Qdrant Native Hybrid Search (Dense + Sparse)
  # ========================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: barvision-qdrant
    ports:
      - "6333:6333" # HTTP API & Web Dashboard
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  # ========================================================
  # Distributed Tracing APM: Jaeger All-in-One
  # ========================================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: barvision-jaeger
    ports:
      - "16686:16686" # Web UI Dashboard
      - "4317:4317"   # OpenTelemetry gRPC Receiver
      - "4318:4318"   # OpenTelemetry HTTP Receiver
    restart: always

  # ========================================================
  # Core API Gateway (FastAPI Async)
  # ========================================================
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: barvision-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=barvision-api
    depends_on:
      - redis
      - qdrant
      - jaeger
    restart: always

  # ========================================================
  # Event-Driven Distributed Workers (Vision + Search + Solver)
  # ========================================================
  worker-1:
    build:
      context: .
      dockerfile: services/workers/Dockerfile
    container_name: barvision-worker-1
    environment:
      - WORKER_ID=worker-1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=barvision-worker
    depends_on:
      - redis
      - qdrant
      - jaeger
    restart: always

  worker-2:
    build:
      context: .
      dockerfile: services/workers/Dockerfile
    container_name: barvision-worker-2
    environment:
      - WORKER_ID=worker-2
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=barvision-worker
    depends_on:
      - redis
      - qdrant
      - jaeger
    restart: always

volumes:
  redis_data:
  qdrant_data:
